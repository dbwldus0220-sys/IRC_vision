# Stable aliases for the latest SDK catalog.
# Retained left-turn selection: 1/2/3/4/5/6 repeats = 15/30/45/60/75/90 degrees.
# Catalog75 t left-turn gait: retain command counts; re-measure actual yaw.
# Stationary right-turn bins: 15/30/45/60/75/90+ degrees -> 1/3/5/6/7/9 repeats.
# Catalog70 t right-turn gait: retain command counts; re-measure actual yaw.
# One/four-repeat turns use the same-camera two-repeat source gait.
# The 45/0/90 in catalog names identifies the camera pose, not the yaw angle.
# Visible-target alignment: left 8/30/45/60/75/90+ degrees -> 1/2/3/4/5/6 repeats.
# Right turns below 15 degrees are skipped; each lower bound is inclusive.
# Left turns below 8 degrees are skipped; 90 degrees and above use six repeats.
# Catalog52 R forward variants; 2/8-cycle commands retain their existing repeat counts.
