# Stable aliases for the latest SDK catalog.
# Calibrated stationary left turns: 1/2/3/4/5/6 repeats = 15/30/45/60/75/90 degrees.
# Calibrated stationary right turns: 2/3/5/7/9 repeats = 15/30/45/65/95 degrees.
# The 45/0/90 in catalog names identifies the camera pose, not the yaw angle.
# Visible-target alignment: left 15/30/45/60/75/90+ degrees -> 1/2/3/4/5/6 repeats.
# Right 15/30/45/65/95+ degrees -> 2/3/5/7/9 repeats; below minimum: no turn.
# Left turns below 15 degrees are skipped; 90 degrees and above use six repeats.
